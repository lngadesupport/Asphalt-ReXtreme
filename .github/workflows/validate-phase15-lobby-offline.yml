name: Validate Phase 15 lobby offline

on:
  push:
    branches: [campaign-edition-win32]
    paths:
      - 'tools/profile_phase15_lobby_offline.ps1'
      - 'PHASE15-FIX-LOBBY-OFFLINE.cmd'
      - '.github/workflows/validate-phase15-lobby-offline.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 15 script
        shell: powershell
        run: |
          $text=Get-Content -LiteralPath 'tools/profile_phase15_lobby_offline.ps1' -Raw
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          $count=([regex]::Matches($text,'Name="')).Count
          if($count -ne 32){throw "Expected 32 patches, found $count"}
          foreach($needle in @(
            'Offset=[Convert]::ToInt32("00916B30",16)',
            'After=[byte[]](0x0F,0x84,0xD3,0x08,0x00,0x00)',
            'Offset=[Convert]::ToInt32("00916B3C",16)',
            'After=[byte[]](0x0F,0x84,0xC7,0x08,0x00,0x00)'
          )){
            if(-not $text.Contains($needle)){throw "Missing expected dispatcher patch: $needle"}
          }
          Write-Host 'Phase 15 syntax and 32-patch manifest OK.'
