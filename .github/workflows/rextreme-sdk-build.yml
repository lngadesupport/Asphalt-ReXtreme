name: ReXtreme SDK Windows Build

on:
  push:
    branches:
      - rextreme-sdk-foundation
    paths:
      - "ReXtremeSDK/**/*.cs"
      - "ReXtremeSDK/**/*.xaml"
      - "ReXtremeSDK/**/*.csproj"
      - "ReXtremeSDK/Integrations/**"
      - "ReXtremeSDK/Data/**"
      - "ReXtremeSDK/schemas/**"
      - ".github/workflows/rextreme-sdk-build.yml"
  workflow_dispatch:

concurrency:
  group: rextreme-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ReXtremeSDK/ReXtremeSDK.csproj -r win-x64

      - name: Build
        run: dotnet build ReXtremeSDK/ReXtremeSDK.csproj -c Release -r win-x64 --no-restore

      - name: Publish standalone single-file
        run: dotnet publish ReXtremeSDK/ReXtremeSDK.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/ReXtremeSDK

      - name: Copy SDK support files
        shell: pwsh
        run: |
          Copy-Item ReXtremeSDK/README.md artifacts/ReXtremeSDK/README.txt
          Copy-Item ReXtremeSDK/schemas artifacts/ReXtremeSDK/schemas -Recurse -Force
          Copy-Item ReXtremeSDK/Data artifacts/ReXtremeSDK/Data -Recurse -Force
          Copy-Item ReXtremeSDK/Integrations artifacts/ReXtremeSDK/Integrations -Recurse -Force
          Set-Content artifacts/ReXtremeSDK/BUILD.txt "ReXtreme SDK standalone Windows x64 - Commit $env:GITHUB_SHA"

      - name: Zip distributable
        shell: pwsh
        run: Compress-Archive -Path artifacts/ReXtremeSDK/* -DestinationPath artifacts/ReXtremeSDK-win-x64.zip -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReXtremeSDK-win-x64
          path: artifacts/ReXtremeSDK-win-x64.zip
          if-no-files-found: error
          retention-days: 30
