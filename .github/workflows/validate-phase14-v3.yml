name: Validate Phase 14 V3 launcher

on:
  push:
    branches: [campaign-edition-win32]
    paths:
      - 'PHASE14-FIX-ONECLICK-V3-VERIFIED.cmd'
      - '.github/workflows/validate-phase14-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned payload and launcher markers
        shell: powershell
        run: |
          $cmd = Get-Content -LiteralPath 'PHASE14-FIX-ONECLICK-V3-VERIFIED.cmd' -Raw
          if($cmd -notmatch '16bbff467ff9e48c70755226f17ac253deb48b3a'){ throw 'Pinned payload commit missing.' }
          if($cmd -notmatch '30/30 patches verificados no AMS'){ throw 'Post-patch verification missing.' }
          $url = 'https://raw.githubusercontent.com/lngadesupport/Asphalt-ReXtreme/16bbff467ff9e48c70755226f17ac253deb48b3a/tools/profile_phase14_no_connection_ui.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile phase14.ps1
          $text = Get-Content -LiteralPath phase14.ps1 -Raw
          foreach($needle in @('00746EDB','008DA2B4','009171DC')){
            if(-not $text.Contains($needle)){ throw "Missing corrected offset $needle" }
          }
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)
          if($errors.Count){ $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'Phase 14 V3 launcher and pinned payload OK.'
