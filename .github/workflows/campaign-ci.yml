name: Campaign Edition CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - campaign-edition-win32

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m compileall -q tools tests
      - name: Run Campaign economy tests
        run: python -m unittest discover -s tests -v

  powershell-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Campaign PowerShell tools
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            "tools/prepare_campaign_source.ps1",
            "tools/campaign_static_audit.ps1",
            "tools/windows-dev/Register-CampaignDev.ps1",
            "tools/windows-dev/Launch-CampaignDev.ps1",
            "tools/windows-dev/Unregister-CampaignDev.ps1",
            "tools/unified_diagnostic.ps1",
            "UNIFIED_DIAGNOSTIC.ps1",
            "tools/profile_phase9_internal.ps1",
            "tools/profile_phase10_local_sync.ps1",
            "tools/profile_phase11_no_connection_errors.ps1",
            "tools/profile_phase12_local_offline.ps1",
            "tools/profile_phase13_local_onboarding.ps1",
            "tools/profile_phase14_connection_ui_map.ps1",
            "tools/profile_phase14_no_connection_ui.ps1",
            "tools/profile_phase15_popup_dispatch_map.ps1",
            "tools/profile_phase15_lobby_offline.ps1",
            "tools/profile_phase16_local_online_gate_map.ps1",
            "tools/runtime_session_logger.ps1",
            "tools/run_local_backend_discovery.ps1",
            "tools/profile_phase18_backend_url_map.ps1",
            "tools/run_phase19_local_backend.ps1",
            "tools/run_phase20_local_gates.ps1",
            "tools/profile_phase21_internal_force_offline.ps1",
            "tools/run_phase22_popup_trace.ps1",
            "tools/profile_phase22_popup_tripwire.ps1",
            "tools/profile_phase20_local_online_gates.ps1",
            "tools/profile_phase19_local_backend_route.ps1",
            "tools/scan_backend_endpoints.ps1",
            "tools/rextreme_local_backend.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $path"
              $errors | Format-List
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke-test static audit
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "campaign-fixture"
          $out = Join-Path $env:RUNNER_TEMP "campaign-output"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          "MZ fake AMS Windows.ApplicationModel.Store ms-windows-store: Microsoft.Live.dll" |
            Set-Content -LiteralPath (Join-Path $fixture "AMS.exe") -Encoding ASCII
          "<Package><Identity Name='A278AB0D.AsphaltXtreme'/></Package>" |
            Set-Content -LiteralPath (Join-Path $fixture "AppxManifest.xml") -Encoding UTF8
          Copy-Item -LiteralPath "$env:WINDIR\System32\notepad.exe" -Destination (Join-Path $fixture "platform.exe")
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/campaign_static_audit.ps1 -GameDir $fixture -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-ChildItem -LiteralPath $out -Directory | Select-Object -First 1
          if (-not $report) { throw "Audit report directory was not created" }
          $csv = Import-Csv (Join-Path $report.FullName "reports/microsoft-service-findings.csv")
          if (@($csv).Count -lt 2) { throw "Expected Store/package findings were not detected" }
          $imports = Import-Csv (Join-Path $report.FullName "reports/pe-imports.csv")
          if (@($imports | Where-Object { $_.File -eq "platform.exe" -and $_.DLL }).Count -eq 0) {
            throw "PE import parser did not return imports for platform.exe"
          }


      - name: Validate Phase 46 Python mapper
        run: python -m py_compile tools/profile_phase46_craftcar_observer_map.py


      - name: Validate Phase 49 Python mapper
        run: python -m py_compile tools/profile_phase49_build_button_map.py


      - name: Validate Phase 50 Python mapper
        run: python -m py_compile tools/profile_phase50_build_button_state.py


      - name: Validate Phase 52 Python mapper
        run: python -m py_compile tools/profile_phase52_preclick_build_button.py
