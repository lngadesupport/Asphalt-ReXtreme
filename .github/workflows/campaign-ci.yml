name: Campaign Edition CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - campaign-edition-win32

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m compileall -q tools tests
      - name: Run Campaign economy tests
        run: python -m unittest discover -s tests -v
