name: Analyze localprofile xrefs

on:
  workflow_dispatch:
  push:
    branches: [campaign-edition-win32]
    paths:
      - '.github/workflows/analyze-localprofile-xrefs.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble supplied xref windows
        shell: bash
        run: |
          python -m pip install --quiet capstone
          cat > /tmp/analyze.py <<'PY'
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          samples = {
            0x0068FEA1: "F4 64 A3 00 00 00 00 8B F1 8B 46 2C 85 C0 74 13 8B 0D E0 84 94 01 50 E8 13 1C A3 FF C7 46 2C 00 00 00 00 8D 45 EC 50 E8 A3 B3 9F FF 83 C4 04 68 08 FC 54 01 8D 4D F0 C7 45 FC 00 00 00 00 51 8B C8 E8 F9 58 A1 FF 50 C6 45 FC 01 E8 EF CC 9F FF 8B 45 F0 83 C4 04 83 CF FF BE 01 00 00 00 BB AC 50 94 01 85 C0 74 16 8B 48 20 85 C9 74 0F 8B C7 F0 0F C1 01 48 75 06 8B C6 F0 0F C1 03 8B 45 EC C7 45 FC FF FF FF FF 85 C0 74 16 8B 48 20 85 C9 74",
            0x0069B961: "8B FB 9C FF 51 8B C4 8D 8D 68 FF FF FF C7 00 01 00 00 00 E8 47 FB 9C FF 6A 01 8D 8D F0 FE FF FF E8 AA 05 9D FF C7 85 EC FE FF FF 00 00 00 00 68 F8 FB 54 01 8D 8D EC FE FF FF C6 45 FC 04 E8 0C E2 9E FF 8D 85 EC FE FF FF C6 45 FC 05 50 8D 8D F0 FE FF FF E8 D6 FD 9C FF 8B 85 EC FE FF FF C6 45 FC 03 85 C0 74 1B 8B 40 20 85 C0 74 14 F0 0F C1 18 8D 43 FF 85 C0 75 09 B8 AC 50 94 01 F0 0F C1 30 8B 47 2C 85 C0 74 13 8B 0D E0 84 94 01 50 E8",
            0x006BADC5: "45 FC 00 00 00 00 8B CB C7 00 01 00 00 00 E8 08 07 9B FF 68 98 DE 93 01 8B CB E8 0C 07 9B FF 6A 04 8B CB E8 43 11 9B FF C7 45 F0 00 00 00 00 68 F8 FB 54 01 8D 4D F0 C6 45 FC 01 E8 AB ED 9C FF 8D 45 F0 C6 45 FC 02 50 8B CB E8 7C 09 9B FF 8B 45 F0 83 CF FF C6 45 FC 00 BE 01 00 00 00 85 C0 74 1B 8B 48 20 85 C9 74 14 8B C7 F0 0F C1 01 48 75 0B 8B C6 B9 AC 50 94 01 F0 0F C1 01 53 8B 5D E8 8B 4B 4C E8 A2 79 47 00 8B 45 E0 89 45 EC 8B 45"
          }

          md = Cs(CS_ARCH_X86, CS_MODE_32)
          for xref, hx in samples.items():
              code = bytes.fromhex(hx)
              base = xref - 48
              print(f"===== XREF 0x{xref:08X} / base 0x{base:08X} =====")
              for ins in md.disasm(code, base):
                  marker = "  <=== XREF" if ins.address <= xref < ins.address + ins.size else ""
                  print(f"0x{ins.address:08X}: {ins.mnemonic:8} {ins.op_str}{marker}")
              print()
          PY
          python /tmp/analyze.py
