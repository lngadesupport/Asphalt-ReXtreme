name: Campaign Runtime V2

on:
  push:
    branches: [campaign-edition-win32]
    paths:
      - "src-reconstructed/campaign-runtime-v2/**"
      - ".github/workflows/campaign-runtime-v2.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build V2 test
        shell: cmd
        run: >
          cl.exe /nologo /std:c++17 /EHsc /MT
          src-reconstructed\campaign-runtime-v2\CampaignRuntimeV2.cpp
          src-reconstructed\campaign-runtime-v2\CampaignRuntimeV2Test.cpp
          /Fe:CampaignRuntimeV2Test.exe
      - name: Run V2 test
        shell: cmd
        run: CampaignRuntimeV2Test.exe
