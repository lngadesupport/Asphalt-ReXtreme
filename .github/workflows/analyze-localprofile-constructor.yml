          xref=0x0069B961
          base=xref-512
          data=bytes.fromhex(hx)
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          ins=list(md.disasm(data,base))
          # nearest classic prologue before xref
          starts=[i for i,x in enumerate(ins) if x.address<=xref and x.mnemonic=="push" and x.op_str=="ebp"]
          si=starts[-1] if starts else 0
          print("BASE",hex(base),"XREF",hex(xref),"START",hex(ins[si].address))
          for x in ins[si:]:
              if x.address > xref+900: break
              mark=" <=== localprofile" if x.address<=xref<x.address+x.size else ""
              print(f"0x{x.address:08X}: {x.mnemonic:8} {x.op_str}{mark}")
          PY
          python /tmp/an.py
