name: Analyze localprofile constructor

on:
  workflow_dispatch:
  push:
    branches: [campaign-edition-win32]
    paths:
      - '.github/workflows/analyze-localprofile-constructor.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
