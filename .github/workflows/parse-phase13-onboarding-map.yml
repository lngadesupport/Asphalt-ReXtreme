name: Parse phase 13 onboarding mapper

on:
  push:
    branches: [campaign-edition-win32]
    paths:
      - 'tools/profile_phase13_onboarding_map.ps1'
      - 'RUN-PROFILE-PHASE13-ONBOARDING-MAP.cmd'
      - 'GET-PHASE13-ONBOARDING-MAP.cmd'
      - 'docs/PROFILE_PHASE13_ONBOARDING_MAP.md'
      - '.github/workflows/parse-phase13-onboarding-map.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'tools/profile_phase13_onboarding_map.ps1' -Raw
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Phase 13 PowerShell syntax OK.'
