name: Public Beta CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - public-beta-0.1
  push:
    branches:
      - public-beta-0.1

jobs:
  beta-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate beta manifest
        shell: pwsh
        run: |
          $v = Get-Content beta/VERSION.json -Raw | ConvertFrom-Json
          if ($v.version -ne "0.1.0-beta.1") { throw "Unexpected beta version" }
          if ($v.source_build -ne "1.7.3.8-x86") { throw "Unexpected source build" }
          if ($v.portable_startup_ready -ne $false) { throw "Portable startup must remain false until runtime validation" }
          if ($v.startup_mode -ne "uwp-loose-compatibility") { throw "Unexpected startup mode" }

      - name: Parse public beta PowerShell
        shell: pwsh
        run: |
          foreach ($script in @(
            "tools/public_beta.ps1",
            "tools/capture_beta_runtime.ps1",
            "tools/beta_startup_bisect.ps1",
            "tools/test_profile_only.ps1",
            "tools/test_profile_offline.ps1",
            "tools/test_offline_surface_v5.ps1",
            "tools/test_frontend_only_v2.ps1",
            "tools/read_garage_trace.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "Parse errors in $script"
              $errors | Format-List
              exit 1
            }
          }

      - name: Compile Campaign Python tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Campaign unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Audit offline authority
        shell: pwsh
        run: python tools/audit_offline_authority.py --project-root . --require-source
