name: Public Beta CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - public-beta-0.1
  push:
    branches:
      - public-beta-0.1

jobs:
  beta-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate beta manifest
        shell: pwsh
        run: |
          $v = Get-Content beta/VERSION.json -Raw | ConvertFrom-Json
          if ($v.version -ne "0.1.0-beta.1") { throw "Unexpected beta version" }
          if ($v.source_build -ne "1.7.3.8-x86") { throw "Unexpected source build" }

      - name: Parse new Campaign PowerShell
        shell: pwsh
        run: |
          foreach ($script in @(
            "RUN-REX-CAMPAIGN.ps1",
            "tools/rex_build_base.ps1",
            "tools/rex_apply.ps1",
            "tools/rex_test.ps1",
            "tools/build_package_phase5.ps1",
            "tools/public_beta.ps1"
          )) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if($errors.Count -gt 0){
              Write-Host "Parse errors in $script"
              $errors|Format-List
              exit 1
            }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile new Campaign Python
        shell: pwsh
        run: |
          python -m py_compile tools/rex_build_content.py
          python -m py_compile tools/rex_patch_frontend.py
          python -m py_compile tools/rex_audit.py

      - name: Run new Campaign tests
        shell: pwsh
        run: python -m unittest tests.test_rex_campaign -v

      - name: Audit new-only architecture
        shell: pwsh
        run: python tools/rex_audit.py --project-root .
