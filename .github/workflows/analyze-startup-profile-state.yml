name: Analyze startup profile state machine

on:
  workflow_dispatch:
  push:
    branches: [campaign-edition-win32]
    paths:
      - '.github/workflows/analyze-startup-profile-state.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble startup sync window
        shell: bash
        run: |
          python -m pip install --quiet capstone
          cat > /tmp/an.py <<'PY'
          from capstone import *
          hx="""00 8B 0D 88 E4 93 01 E8 D9 AC 21 00 8B 0D 88 E4 93 01 E8 0E DA 1E 00 84 C0 0F 94 C0 E9 1D 02 00 00 83 BF 04 02 00 00 0B 0F 84 14 02 00 00 8B 0D D0 A1 93 01 E8 7C E1 A5 FF 85 C0 74 16 8B 0D 54 A6 93 01 E8 CD B8 C9 FF C6 85 76 FF FF FF 00 84 C0 74 07 C6 85 76 FF FF FF 01 8B 0D DC A7 93 01 8A 41 5A 84 C0 75 0E 8A 41 59 C6 85 6A FF FF FF 00 84 C0 74 07 C6 85 6A FF FF FF 01 8B 0D 84 A5 93 01 E8 BE 1C C7 FF 84 C0 74 16 8B 0D 84 A5 93 01 E8 3F 1C C7 FF C6 85 77 FF FF FF 01 84 C0 74 07 C6 85 77 FF FF FF 00 80 BD 76 FF FF FF 00 0F 84 8D 01 00 00 8B 0D B8 A1 93 01 E8 85 53 28 00 84 C0 74 16 80 BD 6A FF FF FF 00 75 0D 80 BD 77 FF FF FF 00 0F 85 68 01 00 00 8B 0D B8 A1 93 01 6A 01 E8 DE 1F 29 00 8B 0D 6C A5 93 01 E8 E3 D9 FE FF 8B 0D 80 A5 93 01 68 14 CC 00 00 68 47 37 04 00 E8 1E 8A 24 00 83 EC 08 C6 85 70 FF FF FF 00 8B F4 C6 85 77 FF FF FF 00 8D 85 77 FF FF FF C7 45 E0 60 00 CE 00 C7 45 E4 00 00 00 00 FF B5 70 FF FF FF 89 7D E8 50 8D 45 E0 50 51 8B CC 68 88 1B 55 01 E8 BC 92 74 FF 8D 85 6C FF FF FF 50 E8 70 AE C6 FF 83 C4 08 50 8D 85 24 FF FF FF C7 45 FC 27 00 00 00 50 E8 69 2E F4 FF 83 C4 10 50 8B CE C6 45 FC 28 E8 EA 64 A9 FF 8B CF E8 83 AA FE FF 8D 8D 24 FF FF FF C6 45 FC 27 E8 C4 4A 74 FF 8D 8D 6C FF FF FF C7 45 FC FF FF FF FF E8 F2 4F 74 FF E9 9A 00 00 00 8D 85 04 FF FF FF 50 E8 71 6D D6 FF 8B 08 6A 03 C7 45 FC 29 00 00 00 E8 F1 1D 3D 00 8D 8D 04 FF FF FF C7 45 FC FF FF FF FF E8 AF D8 88 FF 8B 0D B8 A1 93 01 8D 85 1C FF FF FF 50 E8 3D 6D D6 FF 8B 08 6A 01 C7 45 FC 2A 00 00 00 E8 BD 1D 3D 00 8D 8D 1C FF FF FF C7 45 FC FF FF FF FF E8 7B D8 88 FF EB 36 8D 85 6B FF FF FF 8B CF 50 8D 85 76 FF FF FF 50 E8 C4 96 FF FF EB 15 8D 85 6B FF FF FF 8B CF 50 8D 85 76 FF FF FF 50 E8 5D 9C FF FF 8A 85 76 FF FF FF 84 C0 74 10 FF 87 80 01 00 00 C7 87 84 01 00 00 00 00 00 00 66 0F 6E 87 80 01 00 00 0F 5B C0 8B 8F D8 02 00 00 F3 0F 5E 05 18 2F 66 01 F3 0F 11 87 E4 02 00 00 85 C9 0F 84 A4 00 00 00 E8 85 6A A9 FF F3 0F 10 87 E4 02 00 00 D9 9D 6C FF FF FF 0F 2F 85 6C FF FF FF 0F 86 84 00 00 00 8B 0D D0 A1 93 01 E8 CF 01 9E FF 8B C8 E8 88 35 1E 00 8B 0D 54 A6 93 01 E8 4D B1 C9 FF 8B 8F 8C 01 00 00 85 C9 75 16 84 C0 75 12 F3 0F 10 87 E4 02 00 00 F3 0F 59 05 B0 2C 66 01 EB 21 83 F9 01 75 24 84 C0 75 20 F3 0F 10 87 E4 02 00 00 F3 0F 59 05 08 6B 55 01 F3 0F 58 05 9C 85 57 01 F3 0F 11 87 E4 02 00 00 F3 0F 10 87 E4 02 00 00 68 FA 00 00 00 51 8B 8F D8 02 00 00 F3 0F 11 04 24 E8 F6 69 A9 FF 80 BD 6B FF FF FF 00 0F 84 FB 03 00 00 C7 87 80 01 00 00 FF FF FF FF 8B 0D 5C BD 93 01 6A 00 E8 C2 CE"""
          xref=0x0092B8BB
          base=xref-320
          data=bytes.fromhex(hx)
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          for x in md.disasm(data,base):
              mark=" <=== STR_MENU_SYNC_LOADING" if x.address<=xref<x.address+x.size else ""
              print(f"0x{x.address:08X}: {x.mnemonic:8} {x.op_str}{mark}")
          PY
          python /tmp/an.py
