name: ReXtreme Game Foundation Tests

on:
  push:
    branches:
      - rextreme-game-next
    paths:
      - "tools/campaign_rebuilder.py"
      - "tools/audit_presentation_capabilities.py"
      - "tools/build_presentation_capability_catalog.py"
      - "tools/build_presentation_binding_catalog.py"
      - "tools/build_photo_binding_catalog.py"
      - "tools/build_replay_binding_catalog.py"
      - "tools/build_original_ui_binding_catalog.py"
      - "tools/build_race_hud_binding_catalog.py"
      - "tools/build_campaign_challenge_catalog.py"
      - "config/presentation-capabilities.verified.json"
      - "config/presentation-bindings.verified.json"
      - "config/photo-bindings.verified.json"
      - "config/replay-bindings.verified.json"
      - "config/original-ui-bindings.verified.json"
      - "config/race-hud-bindings.verified.json"
      - "config/campaign_challenges.json"
      - "config/replay-frame-binding.verified.json"
      - "config/photo-frame-binding.verified.json"
      - "config/photo-toggle-binding.verified.json"
      - "tests/test_campaign_rebuilder.py"
      - "tests/test_audit_presentation_capabilities.py"
      - "tests/test_build_presentation_capability_catalog.py"
      - "tests/test_build_presentation_binding_catalog.py"
      - "tests/test_build_photo_binding_catalog.py"
      - "tests/test_build_replay_binding_catalog.py"
      - "tests/test_build_original_ui_binding_catalog.py"
      - "tests/test_build_race_hud_binding_catalog.py"
      - "tests/test_build_campaign_challenge_catalog.py"
      - "tools/audit_original_settings_ui.py"
      - "tools/rank_original_ui_candidates.py"
      - "tools/audit_original_ui_rtti.py"
      - "tools/audit_race_hud_fields.py"
      - "tools/audit_replay_frame_hooks.py"
      - "tools/audit_replay_transform_bindings.py"
      - "tools/apply_replay_frame_binding.py"
      - "tools/apply_photo_frame_binding.py"
      - "tools/apply_photo_toggle_binding.py"
      - "tests/test_audit_original_settings_ui.py"
      - "tests/test_rank_original_ui_candidates.py"
      - "tests/test_audit_original_ui_rtti.py"
      - "tests/test_audit_race_hud_fields.py"
      - "tests/test_audit_replay_frame_hooks.py"
      - "tests/test_audit_replay_transform_bindings.py"
      - "tests/test_apply_replay_frame_binding.py"
      - "tests/test_apply_photo_frame_binding.py"
      - "tests/test_apply_photo_toggle_binding.py"
      - ".github/workflows/rextreme-game-tests.yml"
  workflow_dispatch:

concurrency:
  group: rextreme-game-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused game tests
        run: >
          python -m pytest -q
          tests/test_campaign_rebuilder.py
          tests/test_audit_presentation_capabilities.py
          tests/test_build_presentation_capability_catalog.py
          tests/test_build_presentation_binding_catalog.py
          tests/test_build_photo_binding_catalog.py
          tests/test_build_replay_binding_catalog.py
          tests/test_build_original_ui_binding_catalog.py
          tests/test_build_race_hud_binding_catalog.py
          tests/test_build_campaign_challenge_catalog.py
          tests/test_audit_original_settings_ui.py
          tests/test_rank_original_ui_candidates.py
          tests/test_audit_original_ui_rtti.py
          tests/test_audit_race_hud_fields.py
          tests/test_audit_replay_frame_hooks.py
          tests/test_audit_replay_transform_bindings.py
          tests/test_apply_replay_frame_binding.py
          tests/test_apply_photo_frame_binding.py
          tests/test_apply_photo_toggle_binding.py
      - name: Build safe empty presentation catalog
        run: >
          python tools/build_presentation_capability_catalog.py
          config/presentation-capabilities.verified.json
          CampaignPresentationOptions.dat
          --report CampaignPresentationOptions.report.json
      - name: Verify empty allowlist
        shell: pwsh
        run: |
          $r = Get-Content CampaignPresentationOptions.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified options leaked into runtime catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty catalog" }
          if ((Get-Item CampaignPresentationOptions.dat).Length -ne 16) { throw "Unexpected empty catalog size" }

      - name: Build safe empty presentation binding catalog
        run: >
          python tools/build_presentation_binding_catalog.py
          config/presentation-bindings.verified.json
          config/presentation-capabilities.verified.json
          CampaignPresentationBindings.dat
          --report CampaignPresentationBindings.report.json
      - name: Verify empty binding allowlist
        shell: pwsh
        run: |
          $r = Get-Content CampaignPresentationBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified presentation bindings leaked into runtime catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty binding catalog" }
          if ((Get-Item CampaignPresentationBindings.dat).Length -ne 28) { throw "Unexpected empty binding catalog size" }

      - name: Build safe empty Photo binding catalog
        run: >
          python tools/build_photo_binding_catalog.py
          config/photo-bindings.verified.json
          CampaignPhotoBindings.dat
          --report CampaignPhotoBindings.report.json
      - name: Verify Photo bindings remain fail-closed
        shell: pwsh
        run: |
          $r = Get-Content CampaignPhotoBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified Photo bindings leaked into runtime catalog" }
          if ($r.free_camera_ready) { throw "Free Camera cannot be ready with an empty catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty Photo binding catalog" }
          if ((Get-Item CampaignPhotoBindings.dat).Length -ne 28) { throw "Unexpected Photo catalog size" }

      - name: Build safe empty Replay transform binding catalog
        run: >
          python tools/build_replay_binding_catalog.py
          config/replay-bindings.verified.json
          CampaignReplayBindings.dat
          --report CampaignReplayBindings.report.json
      - name: Verify Replay recording remains fail-closed
        shell: pwsh
        run: |
          $r = Get-Content CampaignReplayBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified Replay bindings leaked into runtime catalog" }
          if ($r.recording_ready) { throw "Replay recording cannot be ready with an empty catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty Replay binding catalog" }
          if ((Get-Item CampaignReplayBindings.dat).Length -ne 28) { throw "Unexpected Replay catalog size" }

      - name: Build safe empty original UI binding catalog
        run: >
          python tools/build_original_ui_binding_catalog.py
          config/original-ui-bindings.verified.json
          CampaignOriginalUiBindings.dat
          --report CampaignOriginalUiBindings.report.json
      - name: Verify original-only UI policy
        shell: pwsh
        run: |
          $r = Get-Content CampaignOriginalUiBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified original UI bindings leaked into runtime catalog" }
          if (-not $r.original_ui_only) { throw "Original-only UI policy was disabled" }
          if ($r.custom_ui_assets_allowed) { throw "Custom in-game UI assets must remain forbidden" }
          if ($r.fallback_if_unmapped -ne "feature-hidden") { throw "Unmapped UI features must remain hidden" }
          if ((Get-Item CampaignOriginalUiBindings.dat).Length -ne 28) { throw "Unexpected original UI catalog size" }

      - name: Build safe empty race HUD binding catalog
        run: >
          python tools/build_race_hud_binding_catalog.py
          config/race-hud-bindings.verified.json
          CampaignRaceHudBindings.dat
          --report CampaignRaceHudBindings.report.json
      - name: Verify race HUD remains original-only
        shell: pwsh
        run: |
          $r = Get-Content CampaignRaceHudBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified HUD bindings leaked into runtime catalog" }
          if (-not $r.original_elements_only) { throw "HUD original-elements-only policy was disabled" }
          if ($r.create_new_hud_widgets) { throw "New HUD widgets must remain forbidden" }
          if ((Get-Item CampaignRaceHudBindings.dat).Length -ne 28) { throw "Unexpected HUD catalog size" }

      - name: Build offline Challenge catalog
        run: >
          python tools/build_campaign_challenge_catalog.py
          config/campaign_challenges.json
          CampaignChallenges.dat
          --report CampaignChallenges.report.json
      - name: Verify Challenge catalog uses only existing race metrics
        shell: pwsh
        run: |
          $r = Get-Content CampaignChallenges.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Default Challenge catalog should remain data-empty until content is approved" }
          if ((Get-Item CampaignChallenges.dat).Length -ne 7188) { throw "Unexpected Challenge catalog size" }
