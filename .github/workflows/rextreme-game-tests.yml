name: ReXtreme Game Foundation Tests

on:
  push:
    branches:
      - rextreme-game-next
    paths:
      - "tools/campaign_rebuilder.py"
      - "tools/audit_presentation_capabilities.py"
      - "tools/build_presentation_capability_catalog.py"
      - "tools/build_presentation_binding_catalog.py"
      - "tools/build_photo_binding_catalog.py"
      - "config/presentation-capabilities.verified.json"
      - "config/presentation-bindings.verified.json"
      - "config/photo-bindings.verified.json"
      - "config/replay-frame-binding.verified.json"
      - "config/photo-frame-binding.verified.json"
      - "tests/test_campaign_rebuilder.py"
      - "tests/test_audit_presentation_capabilities.py"
      - "tests/test_build_presentation_capability_catalog.py"
      - "tests/test_build_presentation_binding_catalog.py"
      - "tests/test_build_photo_binding_catalog.py"
      - "tools/audit_original_settings_ui.py"
      - "tools/audit_replay_frame_hooks.py"
      - "tools/apply_replay_frame_binding.py"
      - "tools/apply_photo_frame_binding.py"
      - "tests/test_audit_original_settings_ui.py"
      - "tests/test_audit_replay_frame_hooks.py"
      - "tests/test_apply_replay_frame_binding.py"
      - "tests/test_apply_photo_frame_binding.py"
      - ".github/workflows/rextreme-game-tests.yml"
  workflow_dispatch:

concurrency:
  group: rextreme-game-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused game tests
        run: >
          python -m pytest -q
          tests/test_campaign_rebuilder.py
          tests/test_audit_presentation_capabilities.py
          tests/test_build_presentation_capability_catalog.py
          tests/test_build_presentation_binding_catalog.py
          tests/test_build_photo_binding_catalog.py
          tests/test_audit_original_settings_ui.py
          tests/test_audit_replay_frame_hooks.py
          tests/test_apply_replay_frame_binding.py
          tests/test_apply_photo_frame_binding.py
      - name: Build safe empty presentation catalog
        run: >
          python tools/build_presentation_capability_catalog.py
          config/presentation-capabilities.verified.json
          CampaignPresentationOptions.dat
          --report CampaignPresentationOptions.report.json
      - name: Verify empty allowlist
        shell: pwsh
        run: |
          $r = Get-Content CampaignPresentationOptions.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified options leaked into runtime catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty catalog" }
          if ((Get-Item CampaignPresentationOptions.dat).Length -ne 16) { throw "Unexpected empty catalog size" }

      - name: Build safe empty presentation binding catalog
        run: >
          python tools/build_presentation_binding_catalog.py
          config/presentation-bindings.verified.json
          config/presentation-capabilities.verified.json
          CampaignPresentationBindings.dat
          --report CampaignPresentationBindings.report.json
      - name: Verify empty binding allowlist
        shell: pwsh
        run: |
          $r = Get-Content CampaignPresentationBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified presentation bindings leaked into runtime catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty binding catalog" }
          if ((Get-Item CampaignPresentationBindings.dat).Length -ne 20) { throw "Unexpected empty binding catalog size" }

      - name: Build safe empty Photo binding catalog
        run: >
          python tools/build_photo_binding_catalog.py
          config/photo-bindings.verified.json
          CampaignPhotoBindings.dat
          --report CampaignPhotoBindings.report.json
      - name: Verify Photo bindings remain fail-closed
        shell: pwsh
        run: |
          $r = Get-Content CampaignPhotoBindings.report.json -Raw | ConvertFrom-Json
          if ($r.count -ne 0) { throw "Unverified Photo bindings leaked into runtime catalog" }
          if ($r.free_camera_ready) { throw "Free Camera cannot be ready with an empty catalog" }
          if (-not $r.safe_empty_catalog) { throw "Expected safe empty Photo binding catalog" }
          if ((Get-Item CampaignPhotoBindings.dat).Length -ne 20) { throw "Unexpected Photo catalog size" }
