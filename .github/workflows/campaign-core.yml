            PhotoFreeCameraRequiresCompleteBindings = $true
            PresentationSettings = "ReXtremePresentation.dat"
            ReplayFormat = ".rexreplay"
            ReplayRuntimeFoundation = $true
            PhotoModeRuntimeFoundation = $true
            RendererOverridesDefaultToOriginal = $true
            PresentationCapabilityCatalog = "CampaignPresentationOptions.dat"
