name: Campaign Core x86

on:
  workflow_dispatch:
  push:
    branches:
      - campaign-edition-win32
      - rextreme-game-next
    paths:
      - "src-reconstructed/campaign-core/CampaignCore.c"
      - "src-reconstructed/campaign-core/CampaignCore.h"
      - "src-reconstructed/campaign-core/CampaignPresentation.c"
      - "src-reconstructed/campaign-core/CampaignPresentation.h"
      - "src-reconstructed/campaign-core/CampaignPresentationCatalog.c"
      - "src-reconstructed/campaign-core/CampaignPresentationCatalog.h"
      - "src-reconstructed/campaign-core/CampaignPresentationBindings.c"
