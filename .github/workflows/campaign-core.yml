      - "src-reconstructed/campaign-core/CampaignEventCatalog.c"
      - "src-reconstructed/campaign-core/CampaignEventCatalog.h"
      - "src-reconstructed/campaign-core/CampaignSpecialEventCatalog.c"
      - "src-reconstructed/campaign-core/CampaignSpecialEventCatalog.h"
      - "src-reconstructed/campaign-core/CampaignSpecialEventState.c"
      - "src-reconstructed/campaign-core/CampaignSpecialEventState.h"
      - "src-reconstructed/campaign-core/CampaignSpecialEventTest.c"
      - "src-reconstructed/campaign-core/CampaignObjectiveCatalog.c"
      - "src-reconstructed/campaign-core/CampaignObjectiveCatalog.h"
      - "src-reconstructed/campaign-core/CampaignChallengeCatalog.c"
      - "src-reconstructed/campaign-core/CampaignChallengeCatalog.h"
      - "src-reconstructed/campaign-core/CampaignChallengeTest.c"
      - "src-reconstructed/campaign-core/CampaignStatistics.c"
      - "src-reconstructed/campaign-core/CampaignStatistics.h"
      - "src-reconstructed/campaign-core/CampaignStatisticsTest.c"
      - "src-reconstructed/campaign-core/CampaignAchievementCatalog.c"
      - "src-reconstructed/campaign-core/CampaignAchievementCatalog.h"
      - "src-reconstructed/campaign-core/CampaignAchievementTest.c"
      - "src-reconstructed/campaign-core/CampaignLastResult.c"
      - "src-reconstructed/campaign-core/CampaignLastResult.h"
      - "src-reconstructed/campaign-core/CampaignLastResultTest.c"
      - "src-reconstructed/campaign-core/CampaignUpgradeCatalog.c"
      - "src-reconstructed/campaign-core/CampaignUpgradeCatalog.h"
      - "src-reconstructed/campaign-core/CampaignUpgradeUiMap.c"
      - "src-reconstructed/campaign-core/CampaignUpgradeUiMap.h"
      - "src-reconstructed/campaign-core/CampaignStoreCatalog.c"
      - "src-reconstructed/campaign-core/CampaignStoreCatalog.h"
      - "src-reconstructed/campaign-core/CampaignStoreAdapter.c"
      - "src-reconstructed/campaign-core/CampaignStoreAdapter.h"
      - "src-reconstructed/campaign-core/CampaignCareerAdapter.c"
      - "src-reconstructed/campaign-core/CampaignCareerAdapter.h"
      - "src-reconstructed/campaign-core/CampaignUpgradeAdapter.c"
      - "src-reconstructed/campaign-core/CampaignUpgradeAdapter.h"
      - "runtime-stubs/campaign_gateway.asm"
      - "runtime-stubs/IGPLib_x86_campaign.def"
      - "docs/CAMPAIGN-CORE-V2.md"
      - ".github/workflows/campaign-core.yml"

permissions:
  contents: write

concurrency:
  group: campaign-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build no-entry Campaign Core
        shell: powershell
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }

          $install = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $install) { throw "MSVC x86 toolchain not found" }

          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          New-Item -ItemType Directory -Force -Path ".\prebuilt\campaign-core" | Out-Null

          $bat = @"
          @echo off
          call "$vcvars" x86
          if errorlevel 1 exit /b 11

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignCore.obj" "src-reconstructed\campaign-core\CampaignCore.c"
          if errorlevel 1 exit /b 12

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignCatalog.obj" "src-reconstructed\campaign-core\CampaignCatalog.c"
          if errorlevel 1 exit /b 16

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignEventCatalog.obj" "src-reconstructed\campaign-core\CampaignEventCatalog.c"
          if errorlevel 1 exit /b 17

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignSpecialEventCatalog.obj" "src-reconstructed\campaign-core\CampaignSpecialEventCatalog.c"
          if errorlevel 1 exit /b 40

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignSpecialEventState.obj" "src-reconstructed\campaign-core\CampaignSpecialEventState.c"
          if errorlevel 1 exit /b 48

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignObjectiveCatalog.obj" "src-reconstructed\campaign-core\CampaignObjectiveCatalog.c"
          if errorlevel 1 exit /b 20

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignChallengeCatalog.obj" "src-reconstructed\campaign-core\CampaignChallengeCatalog.c"
          if errorlevel 1 exit /b 34

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignStatistics.obj" "src-reconstructed\campaign-core\CampaignStatistics.c"
          if errorlevel 1 exit /b 38

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignAchievementCatalog.obj" "src-reconstructed\campaign-core\CampaignAchievementCatalog.c"
          if errorlevel 1 exit /b 42

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignLastResult.obj" "src-reconstructed\campaign-core\CampaignLastResult.c"
          if errorlevel 1 exit /b 45

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignUpgradeCatalog.obj" "src-reconstructed\campaign-core\CampaignUpgradeCatalog.c"
          if errorlevel 1 exit /b 18

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignUpgradeUiMap.obj" "src-reconstructed\campaign-core\CampaignUpgradeUiMap.c"
          if errorlevel 1 exit /b 20

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignStoreCatalog.obj" "src-reconstructed\campaign-core\CampaignStoreCatalog.c"
          if errorlevel 1 exit /b 19

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignStoreAdapter.obj" "src-reconstructed\campaign-core\CampaignStoreAdapter.c"
          if errorlevel 1 exit /b 22

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignCareerAdapter.obj" "src-reconstructed\campaign-core\CampaignCareerAdapter.c"
          if errorlevel 1 exit /b 20

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignUpgradeAdapter.obj" "src-reconstructed\campaign-core\CampaignUpgradeAdapter.c"
          if errorlevel 1 exit /b 21

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignPresentation.obj" "src-reconstructed\campaign-core\CampaignPresentation.c"
          if errorlevel 1 exit /b 23

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignPresentationCatalog.obj" "src-reconstructed\campaign-core\CampaignPresentationCatalog.c"
          if errorlevel 1 exit /b 24

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignPresentationBindings.obj" "src-reconstructed\campaign-core\CampaignPresentationBindings.c"
          if errorlevel 1 exit /b 28

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignPhotoBindings.obj" "src-reconstructed\campaign-core\CampaignPhotoBindings.c"
          if errorlevel 1 exit /b 29

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignReplayBindings.obj" "src-reconstructed\campaign-core\CampaignReplayBindings.c"
          if errorlevel 1 exit /b 30

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignOriginalUiBindings.obj" "src-reconstructed\campaign-core\CampaignOriginalUiBindings.c"
          if errorlevel 1 exit /b 31

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignRaceHudBindings.obj" "src-reconstructed\campaign-core\CampaignRaceHudBindings.c"
          if errorlevel 1 exit /b 32

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-core\CampaignRaceHudLayout.obj" "src-reconstructed\campaign-core\CampaignRaceHudLayout.c"
          if errorlevel 1 exit /b 33

          ml.exe /nologo /c /coff /Fo"prebuilt\campaign-core\campaign_gateway.obj" "runtime-stubs\campaign_gateway.asm"
          if errorlevel 1 exit /b 13

          link.exe /nologo /dll /noentry /machine:x86 /nodefaultlib /def:"runtime-stubs\IGPLib_x86_campaign.def" /out:"prebuilt\campaign-core\IGPLib_x86.dll" "prebuilt\campaign-core\CampaignCore.obj" "prebuilt\campaign-core\CampaignCatalog.obj" "prebuilt\campaign-core\CampaignEventCatalog.obj" "prebuilt\campaign-core\CampaignSpecialEventCatalog.obj" "prebuilt\campaign-core\CampaignSpecialEventState.obj" "prebuilt\campaign-core\CampaignObjectiveCatalog.obj" "prebuilt\campaign-core\CampaignChallengeCatalog.obj" "prebuilt\campaign-core\CampaignStatistics.obj" "prebuilt\campaign-core\CampaignAchievementCatalog.obj" "prebuilt\campaign-core\CampaignLastResult.obj" "prebuilt\campaign-core\CampaignUpgradeCatalog.obj" "prebuilt\campaign-core\CampaignUpgradeUiMap.obj" "prebuilt\campaign-core\CampaignStoreCatalog.obj" "prebuilt\campaign-core\CampaignStoreAdapter.obj" "prebuilt\campaign-core\CampaignCareerAdapter.obj" "prebuilt\campaign-core\CampaignUpgradeAdapter.obj" "prebuilt\campaign-core\CampaignPresentation.obj" "prebuilt\campaign-core\CampaignPresentationCatalog.obj" "prebuilt\campaign-core\CampaignPresentationBindings.obj" "prebuilt\campaign-core\CampaignPhotoBindings.obj" "prebuilt\campaign-core\CampaignReplayBindings.obj" "prebuilt\campaign-core\CampaignOriginalUiBindings.obj" "prebuilt\campaign-core\CampaignRaceHudBindings.obj" "prebuilt\campaign-core\CampaignRaceHudLayout.obj" "prebuilt\campaign-core\campaign_gateway.obj" kernel32.lib
          if errorlevel 1 exit /b 14

          dumpbin.exe /headers /imports "prebuilt\campaign-core\IGPLib_x86.dll" > "prebuilt\campaign-core\DUMPBIN.txt"
          if errorlevel 1 exit /b 15

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignPresentationTest.obj" "src-reconstructed\campaign-core\CampaignPresentationTest.c"
          if errorlevel 1 exit /b 25

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignPresentationTest.exe" "prebuilt\campaign-core\CampaignPresentationTest.obj" "prebuilt\campaign-core\CampaignPresentation.obj" "prebuilt\campaign-core\CampaignPresentationCatalog.obj" "prebuilt\campaign-core\CampaignPresentationBindings.obj" "prebuilt\campaign-core\CampaignPhotoBindings.obj" "prebuilt\campaign-core\CampaignReplayBindings.obj" "prebuilt\campaign-core\CampaignOriginalUiBindings.obj" "prebuilt\campaign-core\CampaignRaceHudBindings.obj" "prebuilt\campaign-core\CampaignRaceHudLayout.obj" kernel32.lib
          if errorlevel 1 exit /b 26

          "prebuilt\campaign-core\CampaignPresentationTest.exe"
          if errorlevel 1 exit /b 27

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignChallengeTest.obj" "src-reconstructed\campaign-core\CampaignChallengeTest.c"
          if errorlevel 1 exit /b 35

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignChallengeTest.exe" "prebuilt\campaign-core\CampaignChallengeTest.obj" "prebuilt\campaign-core\CampaignChallengeCatalog.obj" "prebuilt\campaign-core\CampaignObjectiveCatalog.obj" kernel32.lib
          if errorlevel 1 exit /b 36

          "prebuilt\campaign-core\CampaignChallengeTest.exe"
          if errorlevel 1 exit /b 37

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignStatisticsTest.obj" "src-reconstructed\campaign-core\CampaignStatisticsTest.c"
          if errorlevel 1 exit /b 39

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignStatisticsTest.exe" "prebuilt\campaign-core\CampaignStatisticsTest.obj" "prebuilt\campaign-core\CampaignStatistics.obj" kernel32.lib
          if errorlevel 1 exit /b 40

          "prebuilt\campaign-core\CampaignStatisticsTest.exe"
          if errorlevel 1 exit /b 41

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignAchievementTest.obj" "src-reconstructed\campaign-core\CampaignAchievementTest.c"
          if errorlevel 1 exit /b 42

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignAchievementTest.exe" "prebuilt\campaign-core\CampaignAchievementTest.obj" "prebuilt\campaign-core\CampaignAchievementCatalog.obj" "prebuilt\campaign-core\CampaignStatistics.obj" kernel32.lib
          if errorlevel 1 exit /b 43

          "prebuilt\campaign-core\CampaignAchievementTest.exe"
          if errorlevel 1 exit /b 44

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignLastResultTest.obj" "src-reconstructed\campaign-core\CampaignLastResultTest.c"
          if errorlevel 1 exit /b 45

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignLastResultTest.exe" "prebuilt\campaign-core\CampaignLastResultTest.obj" "prebuilt\campaign-core\CampaignLastResult.obj" kernel32.lib
          if errorlevel 1 exit /b 46

          "prebuilt\campaign-core\CampaignLastResultTest.exe"
          if errorlevel 1 exit /b 47

          cl.exe /nologo /c /TC /O2 /MT /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /I"src-reconstructed\campaign-core" /Fo"prebuilt\campaign-core\CampaignSpecialEventTest.obj" "src-reconstructed\campaign-core\CampaignSpecialEventTest.c"
          if errorlevel 1 exit /b 48

          link.exe /nologo /machine:x86 /out:"prebuilt\campaign-core\CampaignSpecialEventTest.exe" "prebuilt\campaign-core\CampaignSpecialEventTest.obj" "prebuilt\campaign-core\CampaignSpecialEventCatalog.obj" "prebuilt\campaign-core\CampaignSpecialEventState.obj" "prebuilt\campaign-core\CampaignEventCatalog.obj" kernel32.lib
          if errorlevel 1 exit /b 49

          "prebuilt\campaign-core\CampaignSpecialEventTest.exe"
          if errorlevel 1 exit /b 50

          exit /b 0
          "@

          $batPath = Join-Path $PWD "build-campaign-core.cmd"
          Set-Content -LiteralPath $batPath -Value $bat -Encoding ASCII
          & cmd.exe /d /c $batPath
          if ($LASTEXITCODE -ne 0) { throw "Campaign Core build failed: $LASTEXITCODE" }

          Remove-Item ".\prebuilt\campaign-core\CampaignCore.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignEventCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignSpecialEventCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignSpecialEventState.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignObjectiveCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignChallengeCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignStatistics.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignAchievementCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignLastResult.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignUpgradeCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignUpgradeUiMap.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignStoreCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignStoreAdapter.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignCareerAdapter.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignUpgradeAdapter.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPresentation.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPresentationCatalog.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPresentationBindings.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPhotoBindings.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignReplayBindings.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignOriginalUiBindings.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignRaceHudBindings.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignRaceHudLayout.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\campaign_gateway.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPresentationTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignPresentationTest.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignChallengeTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignChallengeTest.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignStatisticsTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignStatisticsTest.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignAchievementTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignAchievementTest.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignLastResultTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignLastResultTest.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignSpecialEventTest.obj" -ErrorAction SilentlyContinue
          Remove-Item ".\prebuilt\campaign-core\CampaignSpecialEventTest.exe" -ErrorAction SilentlyContinue
          Remove-Item $batPath -ErrorAction SilentlyContinue

      - name: Verify
        shell: powershell
        run: |
          $dll = ".\prebuilt\campaign-core\IGPLib_x86.dll"
          if (-not (Test-Path $dll)) { throw "Campaign Core DLL missing" }

          [byte[]]$d = [IO.File]::ReadAllBytes($dll)
          if ($d[0] -ne 0x4D -or $d[1] -ne 0x5A) { throw "not MZ" }
          $pe = [BitConverter]::ToInt32($d, 0x3C)
          if ([BitConverter]::ToUInt16($d, $pe + 4) -ne 0x014C) { throw "not x86" }
          $opt = $pe + 24
          if ([BitConverter]::ToUInt16($d, $opt) -ne 0x010B) { throw "not PE32" }
          $entry = [BitConverter]::ToUInt32($d, $opt + 16)
          if ($entry -ne 0) { throw ("DLL has entry point RVA 0x{0:X8}" -f $entry) }

          $dump = Get-Content ".\prebuilt\campaign-core\DUMPBIN.txt" -Raw
          if ($dump -match "VCRUNTIME|MSVCP|ucrtbase") { throw "CRT dependency detected" }

          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          $size = (Get-Item $dll).Length

          [ordered]@{
            Phase = "Campaign Core v3"
            Architecture = "x86"
            NoEntry = $true
            StartupRuntime = $false
            CRTDependency = $false
            SecondaryLoadLibrary = $false
            Host = "IGPLib_x86.dll"
            CommandSelector = "0xC0DECA11"
            CraftSelector = "0xC0DEC0DE"
            OwnershipSelector = "0xC0DE0A11"
            State = "UserData\\CampaignEdition\\CampaignSave.dat"
            Backup = "UserData\\CampaignEdition\\CampaignSave.bak"
            PortableSavePreferred = $true
            LegacyPackageSaveFallback = $true
            LegacyPackageSaveMigration = $true
            V1Migration = $true
            V2Migration = $true
            VehicleCatalog = "CampaignCatalog.dat"
            EventCatalog = "CampaignEvents.dat"
            SpecialEventCatalog = "CampaignSpecialEvents.dat"
            SpecialEventsReuseCampaignEvents = $true
            SpecialEventsOnlineBackendRequired = $false
            SpecialEventRotatingProgressState = "UserData\\CampaignEdition\\SpecialEventPeriodState.dat"
            SpecialEventDailyWeeklyMonthlyReset = $true
            SpecialEventsUiRequiresOriginalTemplates = $true
            ObjectiveCatalog = "CampaignObjectives.dat"
            ChallengeCatalog = "CampaignChallenges.dat"
            ChallengeState = "UserData\\CampaignEdition\\ChallengeState.dat"
            ChallengeScopes = "Permanent,Daily,Weekly"
            ChallengeMetricsSource = "CampaignRaceMetrics-v1"
            ChallengeRewardsClaiming = "revision-journaled"
            StatisticsState = "UserData\\CampaignEdition\\CampaignStatistics.dat"
            StatisticsSource = "CampaignRaceMetrics-v1"
            AchievementCatalog = "CampaignAchievements.dat"
            AchievementState = "UserData\\CampaignEdition\\AchievementState.dat"
            AchievementMetricsSource = "CampaignStatistics-v1"
            AchievementRewards = "none"
            AchievementUiRequiresOriginalTemplates = $true
            LastRaceResultState = "UserData\\CampaignEdition\\LastRaceResult.dat"
            LastRaceResultSource = "Committed CampaignRaceMetrics-v1"
            UpgradeCatalog = "CampaignUpgrades.dat"
            UpgradeUiMap = "CampaignUpgradeUiMap.dat"
            StoreCatalog = "CampaignStore.dat"
