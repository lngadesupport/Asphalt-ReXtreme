name: R17 Local Event Runtime

on:
  push:
    branches:
      - campaign-edition-win32
      - r17-local-event-runtime
    paths:
      - "src-reconstructed/local-runtime/**"
      - "runtime-stubs/IGPLib_x86.def"
      - "tools/build_r17_local_event_runtime.ps1"
      - ".github/workflows/r17-local-event-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build R17 runtime
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\tools\build_r17_local_event_runtime.ps1 -SourceDir .

      - name: Verify output
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath ".\RUNTIME_STUBS\IGPLib_x86.dll")) {
            throw "R17 DLL was not produced."
          }
          Get-FileHash -Algorithm SHA256 ".\RUNTIME_STUBS\IGPLib_x86.dll"
          Get-Content ".\RUNTIME_STUBS\R17-BUILD-REPORT.json"

      - name: Publish prebuilt runtime into branch
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\prebuilt\r17" | Out-Null
          Copy-Item ".\RUNTIME_STUBS\IGPLib_x86.dll" ".\prebuilt\r17\IGPLib_x86.dll" -Force
          Copy-Item ".\RUNTIME_STUBS\R17-BUILD-REPORT.json" ".\prebuilt\r17\R17-BUILD-REPORT.json" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/r17/IGPLib_x86.dll prebuilt/r17/R17-BUILD-REPORT.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Prebuilt runtime already up to date."
            exit 0
          }

          git commit -m "build: publish R17 prebuilt x86 runtime [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Upload R17 runtime
        uses: actions/upload-artifact@v4
        with:
          name: R17-LocalEventRuntime-x86
          path: |
            RUNTIME_STUBS/IGPLib_x86.dll
            RUNTIME_STUBS/R17-BUILD-REPORT.json
          if-no-files-found: error
