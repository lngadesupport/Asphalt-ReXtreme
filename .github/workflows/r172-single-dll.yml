name: R17.2 Single DLL Deferred

on:
  push:
    branches: [campaign-edition-win32]
    paths:
      - "src-reconstructed/local-runtime/LocalEventRuntimeR172.cpp"
      - "src-reconstructed/local-runtime/LocalEventRuntime.h"
      - "runtime-stubs/IGPLib_x86_r172.def"
      - "tools/build_r172_single_dll.ps1"
      - ".github/workflows/r172-single-dll.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build R17.2
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\tools\build_r172_single_dll.ps1 -SourceDir .
      - name: Verify
        shell: powershell
        run: |
          Get-Item .\RUNTIME_STUBS\R172\IGPLib_x86.dll
          Get-FileHash -Algorithm SHA256 .\RUNTIME_STUBS\R172\IGPLib_x86.dll
          Get-Content .\RUNTIME_STUBS\R172\R172-BUILD-REPORT.json
      - name: Publish prebuilt
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\prebuilt\r172" | Out-Null
          Copy-Item ".\RUNTIME_STUBS\R172\IGPLib_x86.dll" ".\prebuilt\r172\IGPLib_x86.dll" -Force
          Copy-Item ".\RUNTIME_STUBS\R172\R172-BUILD-REPORT.json" ".\prebuilt\r172\R172-BUILD-REPORT.json" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/r172/IGPLib_x86.dll prebuilt/r172/R172-BUILD-REPORT.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "build: publish R17.2 single DLL runtime [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: R17.2-Single-DLL-x86
          path: |
            RUNTIME_STUBS/R172/IGPLib_x86.dll
            RUNTIME_STUBS/R172/R172-BUILD-REPORT.json
          if-no-files-found: error
