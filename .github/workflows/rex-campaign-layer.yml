name: ReX Campaign Layer
# clean-room verification gate

on:
  push:
    branches:
      - campaign-edition-rex-v2
    paths:
      - "src/campaign-edition/**"
      - "src/integration-shim/**"
      - "src/game-bridge/**"
      - "src/ams-host/**"
      - "builder/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/rex-campaign-layer.yml"
  workflow_dispatch:

jobs:
  test-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Run ReX content builder tests
        shell: cmd
        run: python -m unittest discover -s tests -v

      - name: Compile active ReX content manifest
        shell: cmd
        run: >-
          python builder\rex_content_v2.py
          config\rex_campaign_content.json
          CampaignContentV2.dat

      - name: Audit new-only runtime
        shell: powershell
        run: |
          foreach ($legacy in @("src-reconstructed/campaign-core", "src-reconstructed/campaign-runtime-v2")) {
            if (Test-Path $legacy) { throw "Legacy runtime directory exists: $legacy" }
          }
          $banned = @(
            "CraftCar",
            "GS_Garage",
            "CampaignFrontendBridge",
            "CampaignGarageFlow",
            "CampaignCore",
            "CampaignRuntime",
            "_AMS_PHASE2",
            "src-reconstructed",
            "runtime-stubs",
            "IGPLib_x86"
          )
          foreach ($term in $banned) {
            $roots = @("src/campaign-edition","src/integration-shim","src/game-bridge","src/ams-host")
            if ($term -eq "IGPLib_x86") {
              $roots = @("src/campaign-edition","src/integration-shim")
            }
            $hits = Get-ChildItem $roots -File -Recurse |
              Select-String -SimpleMatch $term
            if ($hits) {
              $hits | ForEach-Object { Write-Host $_.Line }
              throw "Legacy runtime reference detected: $term"
            }
          }
          $testFiles = Get-ChildItem "src/campaign-edition" -File -Recurse |
            Where-Object { $_.Name -match "Test|Spec|Fixture" }
          if ($testFiles) {
            $testFiles | ForEach-Object { Write-Host $_.FullName }
            throw "Test code detected inside production runtime"
          }

      - name: Build ReX Gaia and GlobalSync tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /TC
          src\campaign-edition\RexGaia.c
          src\campaign-edition\RexGlobalSync.c
          src\campaign-edition\RexState.c
          tests\c\RexBackendServicesTest.c
          /I src\campaign-edition
          /Fe:RexBackendServicesTest.exe

      - name: Run ReX Gaia and GlobalSync tests
        shell: cmd
        run: RexBackendServicesTest.exe

      - name: Build ReX platform services tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /TC
          src\campaign-edition\RexGaia.c
          src\campaign-edition\RexPlatformServices.c
          tests\c\RexPlatformServicesTest.c
          /I src\campaign-edition
          /Fe:RexPlatformServicesTest.exe

      - name: Run ReX platform services tests
        shell: cmd
        run: RexPlatformServicesTest.exe

      - name: Build ReX runtime tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /TC
          src\campaign-edition\*.c
          tests\c\RexGarageLayerTest.c
          /I src\campaign-edition
          /Fe:RexGarageLayerTest.exe

      - name: Run ReX runtime tests
        shell: cmd
        run: RexGarageLayerTest.exe

      - name: Build ReX x86 runtime DLL
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /LD /TC
          src\campaign-edition\*.c
          /Fe:RexCore.dll
         

      - name: Verify ReX x86 runtime DLL
        shell: powershell
        run: |
          $headers = (& dumpbin.exe /headers RexCore.dll | Out-String)
          if ($headers -notmatch "14C machine \(x86\)") {
            throw "RexCore.dll is not x86"
          }

          $exports = (& dumpbin.exe /exports RexCore.dll | Out-String)
          Write-Host $exports
          foreach ($name in @(
            "RexHost_Start",
            "RexHost_IsStarted",
            "RexHost_GarageEnter",
            "RexHost_GarageSelectionChanged",
            "RexHost_GarageMontarPressed",
            "RexHost_GaiaIsReady",
            "RexHost_GaiaIsNetworkRequired",
            "RexHost_GlobalSyncPendingCount",
            "RexHost_GlobalSyncCommit",
            "RexHost_GetBoundaryAbiVersion",
            "RexHost_StartV1"
          )) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "Missing export: $name"
            }
          }

          $hash = (Get-FileHash RexCore.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RexCore.dll SHA256=$hash"

      - name: Build ReX integration shim tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /TC
          src\integration-shim\RexIntegrationShim.c
          tests\c\RexIntegrationShimTest.c
          /I src\integration-shim
          /I src\campaign-edition
          /Fe:RexIntegrationShimTest.exe

      - name: Run ReX integration shim tests
        shell: cmd
        run: RexIntegrationShimTest.exe

      - name: Build ReX x86 integration shim DLL
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /LD /TC
          src\integration-shim\RexIntegrationShim.c
          /I src\integration-shim
          /I src\campaign-edition
          /Fe:RexGameShim.dll

      - name: Build ReX IGP proxy
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /LD /TC
          src\game-bridge\RexIgpProxy.c
          /I src\game-bridge
          /I src\integration-shim
          /I src\campaign-edition
          /Fe:IGPLib_x86.dll
          /link /DEF:src\game-bridge\RexIgpProxy.def

      - name: Rewrite exact IGP decorated exports
        shell: cmd
        run: python builder\rex_fix_igp_exports.py IGPLib_x86.dll

      - name: Inspect ReX IGP proxy exports
        shell: cmd
        run: dumpbin.exe /exports IGPLib_x86.dll

      - name: Run ReX IGP proxy tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /TC
          tests\c\RexIgpProxyTest.c
          /I src\game-bridge
          /Fe:RexIgpProxyTest.exe
          && RexIgpProxyTest.exe

      - name: Restore production ReX content manifest
        shell: cmd
        run: >-
          python builder\rex_content_v2.py
          config\rex_campaign_content.json
          CampaignContentV2.dat

      - name: Build new AMS host tests
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /EHsc
          /DREX_AMS_HOST_NO_MAIN
          src\ams-host\RexAmsHost.cpp
          tests\c\RexAmsHostTest.cpp
          /I src\ams-host
          /Fe:RexAmsHostTest.exe

      - name: Run new AMS host tests
        shell: cmd
        run: RexAmsHostTest.exe

      - name: Build new x86 AMS host
        shell: cmd
        run: >-
          cl.exe /nologo /W4 /WX /EHsc /DUNICODE /D_UNICODE
          src\ams-host\RexAmsHost.cpp
          /I src\ams-host
          /Fe:AMS.exe
          ole32.lib uuid.lib user32.lib
          /link /SUBSYSTEM:WINDOWS

      - name: Verify new x86 AMS host
        shell: powershell
        run: |
          $headers = (& dumpbin.exe /headers AMS.exe | Out-String)
          if ($headers -notmatch "14C machine \(x86\)") {
            throw "AMS.exe host is not x86"
          }
          if ($headers -notmatch "Windows GUI") {
            throw "AMS.exe host is not a Windows GUI executable"
          }
          $hash = (Get-FileHash AMS.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "AMS.exe host SHA256=$hash"

      - name: Verify ReX x86 integration shim DLL
        shell: powershell
        run: |
          $headers = (& dumpbin.exe /headers RexGameShim.dll | Out-String)
          if ($headers -notmatch "14C machine \(x86\)") {
            throw "RexGameShim.dll is not x86"
          }

          $exports = (& dumpbin.exe /exports RexGameShim.dll | Out-String)
          Write-Host $exports
          foreach ($name in @(
            "RexShim_GetAbiVersion",
            "RexShim_Start",
            "RexShim_IsStarted",
            "RexShim_GarageEnter",
            "RexShim_GarageSelectionChanged",
            "RexShim_GarageMontarPressed",
            "RexShim_CopyGarageSnapshot",
            "RexShim_GetLastActionResult",
            "RexShim_GaiaIsReady",
            "RexShim_GaiaIsNetworkRequired",
            "RexShim_GlobalSyncPendingCount",
            "RexShim_GlobalSyncCommit"
          )) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "Missing shim export: $name"
            }
          }

          $hash = (Get-FileHash RexGameShim.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RexGameShim.dll SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: RexCore-x86
          path: RexCore.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RexGameShim-x86
          path: RexGameShim.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RexGameBridge-x86
          path: |
            IGPLib_x86.dll
            CampaignContentV2.dat
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RexAmsHost-x86
          path: AMS.exe
          if-no-files-found: error
