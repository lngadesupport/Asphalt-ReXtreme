name: Campaign Runtime V1 x86

on:
  workflow_dispatch:
  push:
    branches:
      - public-beta-0.1
    paths:
      - "src-reconstructed/campaign-runtime/**"
      - "runtime-stubs/campaign_runtime_gateway.asm"
      - "runtime-stubs/IGPLib_x86_campaign_runtime.def"
      - "tools/audit_clean_runtime.py"
      - ".github/workflows/campaign-runtime.yml"

permissions:
  contents: write

concurrency:
  group: campaign-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit clean architecture
        shell: pwsh
        run: python tools/audit_clean_runtime.py --project-root .

      - name: Build Campaign Runtime V1
        shell: powershell
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Microsoft Visual Studio\Installer\vswhere.exe"
          $install = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $install) { throw "MSVC x86 toolchain not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          New-Item -ItemType Directory -Force -Path ".\prebuilt\campaign-runtime" | Out-Null

          $bat = @"
          @echo off
          call "$vcvars" x86
          if errorlevel 1 exit /b 11

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-runtime\CampaignRuntimeCatalog.obj" "src-reconstructed\campaign-runtime\CampaignRuntimeCatalog.c"
          if errorlevel 1 exit /b 12

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-runtime\CampaignRuntimeState.obj" "src-reconstructed\campaign-runtime\CampaignRuntimeState.c"
          if errorlevel 1 exit /b 13

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-runtime\CampaignApplication.obj" "src-reconstructed\campaign-runtime\CampaignApplication.c"
          if errorlevel 1 exit /b 14

          cl.exe /nologo /c /TC /O2 /GS- /Zl /DWIN32 /D_WINDOWS /DUNICODE /D_UNICODE /Fo"prebuilt\campaign-runtime\CampaignFrontendPort.obj" "src-reconstructed\campaign-runtime\CampaignFrontendPort.c"
          if errorlevel 1 exit /b 15

          ml.exe /nologo /c /coff /Fo"prebuilt\campaign-runtime\campaign_runtime_gateway.obj" "runtime-stubs\campaign_runtime_gateway.asm"
          if errorlevel 1 exit /b 16

          link.exe /nologo /dll /noentry /machine:x86 /nodefaultlib /def:"runtime-stubs\IGPLib_x86_campaign_runtime.def" /out:"prebuilt\campaign-runtime\IGPLib_x86.dll" "prebuilt\campaign-runtime\CampaignRuntimeCatalog.obj" "prebuilt\campaign-runtime\CampaignRuntimeState.obj" "prebuilt\campaign-runtime\CampaignApplication.obj" "prebuilt\campaign-runtime\CampaignFrontendPort.obj" "prebuilt\campaign-runtime\campaign_runtime_gateway.obj" kernel32.lib
          if errorlevel 1 exit /b 17

          dumpbin.exe /headers /imports "prebuilt\campaign-runtime\IGPLib_x86.dll" > "prebuilt\campaign-runtime\DUMPBIN.txt"
          if errorlevel 1 exit /b 18
          exit /b 0
          "@

          Set-Content build-campaign-runtime.cmd $bat -Encoding ASCII
          & cmd.exe /d /c build-campaign-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "Campaign Runtime build failed: $LASTEXITCODE" }

      - name: Verify
        shell: pwsh
        run: |
          $dll=".\prebuilt\campaign-runtime\IGPLib_x86.dll"
          [byte[]]$d=[IO.File]::ReadAllBytes($dll)
          $pe=[BitConverter]::ToInt32($d,0x3C)
          if([BitConverter]::ToUInt16($d,$pe+4)-ne0x014C){throw "not x86"}
          $opt=$pe+24
          if([BitConverter]::ToUInt16($d,$opt)-ne0x010B){throw "not PE32"}
          if([BitConverter]::ToUInt32($d,$opt+16)-ne0){throw "entry point must be zero"}
          $dump=Get-Content ".\prebuilt\campaign-runtime\DUMPBIN.txt" -Raw
          if($dump-match "VCRUNTIME|MSVCP|ucrtbase"){throw "CRT dependency detected"}

          $hash=(Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          [ordered]@{
            Phase="Campaign Runtime V1"
            Architecture="x86"
            NoEntry=$true
            CRTDependency=$false
            OriginalGameplayStructures=$false
            OriginalFrontendOnly=$true
            State="CampaignRuntimeV1.dat"
            DispatchSelector="0xC0DE9001"
            ReadViewSelector="0xC0DE9002"
            BuildSelectedSelector="0xC0DE9003"
            SelectCarSelector="0xC0DE9004"
            BootSelector="0xC0DE9005"
            LobbySelector="0xC0DE9006"
            SHA256=$hash
          } | ConvertTo-Json | Set-Content ".\prebuilt\campaign-runtime\CAMPAIGN-RUNTIME-REPORT.json" -Encoding UTF8
          Get-Content ".\prebuilt\campaign-runtime\CAMPAIGN-RUNTIME-REPORT.json"

      - name: Publish
        shell: pwsh
        run: |
          $stage=Join-Path $env:RUNNER_TEMP "campaign-runtime-publish"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item ".\prebuilt\campaign-runtime\IGPLib_x86.dll" $stage -Force
          Copy-Item ".\prebuilt\campaign-runtime\CAMPAIGN-RUNTIME-REPORT.json" $stage -Force
          Copy-Item ".\prebuilt\campaign-runtime\DUMPBIN.txt" $stage -Force
          Copy-Item ".\prebuilt\campaign-runtime\CLEAN-RUNTIME-AUDIT.json" $stage -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$env:GITHUB_REF_NAME"
          git reset --hard "origin/$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Force -Path ".\prebuilt\campaign-runtime" | Out-Null
          Copy-Item (Join-Path $stage "IGPLib_x86.dll") ".\prebuilt\campaign-runtime\IGPLib_x86.dll" -Force
          Copy-Item (Join-Path $stage "CAMPAIGN-RUNTIME-REPORT.json") ".\prebuilt\campaign-runtime\CAMPAIGN-RUNTIME-REPORT.json" -Force
          Copy-Item (Join-Path $stage "DUMPBIN.txt") ".\prebuilt\campaign-runtime\DUMPBIN.txt" -Force
          Copy-Item (Join-Path $stage "CLEAN-RUNTIME-AUDIT.json") ".\prebuilt\campaign-runtime\CLEAN-RUNTIME-AUDIT.json" -Force
          git add -f prebuilt/campaign-runtime/*
          git diff --cached --quiet
          if($LASTEXITCODE-eq0){exit 0}
          git commit -m "build: publish clean Campaign Runtime V1 [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Campaign-Runtime-V1-x86
          path: |
            prebuilt/campaign-runtime/IGPLib_x86.dll
            prebuilt/campaign-runtime/CAMPAIGN-RUNTIME-REPORT.json
            prebuilt/campaign-runtime/CLEAN-RUNTIME-AUDIT.json
            prebuilt/campaign-runtime/DUMPBIN.txt
