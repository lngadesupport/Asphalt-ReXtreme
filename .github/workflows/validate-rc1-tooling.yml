name: Validate RC1 tooling

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/**"
      - "tests/**"
      - "patches/**"
      - "config/**"
      - ".github/workflows/validate-rc1-tooling.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
