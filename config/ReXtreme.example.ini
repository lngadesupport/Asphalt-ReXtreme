# Asphalt ReXtreme example configuration
# These options describe project targets; unsupported options are ignored until implemented.

[ReXtreme]
OfflineMode=1
EconomyMode=Premium
DisableAds=1
DisableTelemetry=1
DisableDeadServiceChecks=1

[Economy]
# Premium = balanced paid-game progression.
# Sandbox = unlimited resources / zero-cost progression for testing or free play.
Mode=Premium
RemoveIAP=1
RemoveAdGates=1
RemoveEnergyTimers=1
ConvertPremiumCurrency=1
SeparateSandboxSave=1

[Video]
FOV=90
FPSLimit=0
Borderless=1

[Input]
RawMouseInput=1
