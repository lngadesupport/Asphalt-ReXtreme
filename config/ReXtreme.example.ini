# Asphalt ReXtreme: Campaign Edition
# Portable paid-game/offline target configuration.

[ReXtreme]
Edition=Campaign
OfflineMode=1
PortableMode=1
AvoidMicrosoftStore=1
DisablePackageIdentity=1
DisableStoreIAP=1
DisableMicrosoftAuth=1
DisableXboxAuth=1
DisableAds=1
DisableTelemetry=1
DisableDeadServiceChecks=1

[Economy]
Mode=Premium
RemoveIAP=1
RemoveAdGates=1
RemoveEnergyTimers=1
PremiumCurrencyEarnedInRaces=1
SeparateSandboxSave=1

# 80% discount = user pays 20% of original content price.
VehiclePriceMultiplier=0.20
PaintPriceMultiplier=0.20
UpgradePriceMultiplier=0.20
PartPriceMultiplier=0.20
GenericShopPriceMultiplier=0.20

# Real-money currency packs are not part of Campaign progression.
DisableCurrencyPackPurchases=1

# Repeat reward rule.
RepeatRewardGraceRuns=10
RepeatRewardDecayPerRun=0.002
RepeatRewardFloor=0.98
DisableDailyRewardCaps=1
DisableRaceRewardCooldowns=1
RequireOfflineCareerCompletable=1

[Save]
PortableSave=1
AtomicWrites=1
KeepPreviousBackup=1

[Video]
FOV=90
FPSLimit=0
Borderless=1

[Input]
RawMouseInput=1
