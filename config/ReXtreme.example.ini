# Asphalt ReXtreme: Campaign Edition
# Portable paid-game/offline target configuration.

[ReXtreme]
Edition=Campaign
OfflineMode=1
PortableMode=1
AvoidMicrosoftStore=1
DisablePackageIdentity=1
DisableStoreIAP=1
DisableMicrosoftAuth=1
DisableXboxAuth=1
DisableAds=1
DisableTelemetry=1
DisableDeadServiceChecks=1

[Economy]
Mode=CampaignClassBalanced
PolicyFile=config/campaign_economy.json
RemoveIAP=1
RemoveAdGates=1
RemoveEnergyTimers=1
PremiumCurrencyEarnedInRaces=1
SeparateSandboxSave=1
DisableCurrencyPackPurchases=1
RequireOfflineCareerCompletable=1
GenericNonProgressionPriceMultiplier=0.20

RepeatRewardGraceRuns=10
RepeatRewardDecayPerRun=0.002
RepeatRewardFloor=0.98
DisableDailyRewardCaps=1
DisableRaceRewardCooldowns=1

[OfflineFeatures]
DailyRewardsLocal=1
FreeBoxTimersLocal=1
MaintenanceTimersLocal=1
BlueprintsLocal=1
PartSellFuseDiscardLocal=1
PostRaceProgressLocal=1
PreRaceValidationLocal=1
LeaderboardsNonBlocking=1
GhostDownloadsDisabled=1
MultiplayerDisabled=1
EventsDisabled=1
InboxDisabled=1
AccountLinkDisabled=1
SupportDisabled=1
GlobalLeaderboardsDisabled=1

[Save]
PortableSave=1
AtomicWrites=1
KeepPreviousBackup=1

[Video]
FOV=90
FPSLimit=0
Borderless=1

[Input]
RawMouseInput=1
